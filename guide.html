<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内江职业技术学院新生指南 - 全文阅读</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--primary:#4797FF;--primary-dark:#2E80E0;--bg:#FAFCFF;--card:#FFFFFF;--text:#1A1A2E;--text-secondary:#5A6B7C;--border:#E8F0FA;--accent:#FF7E47;--shadow:0 2px 12px rgba(71,151,255,0.08);--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.8}
/* 顶部导航 */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
.topbar .back{color:var(--primary);text-decoration:none;font-size:0.9em;font-weight:600;display:flex;align-items:center;gap:4px}
.topbar .title{position:absolute;left:50%;transform:translateX(-50%);font-size:1.0em;font-weight:600;color:var(--text);white-space:nowrap}
/* 左侧目录 */
.sidebar{position:fixed;top:56px;left:0;bottom:0;width:260px;background:#fff;border-right:1px solid var(--border);overflow-y:auto;padding:16px 0}
.sidebar a{display:block;padding:8px 20px;color:var(--text-secondary);text-decoration:none;font-size:0.85em;transition:all 0.15s;border-left:3px solid transparent}
.sidebar a:hover{color:var(--primary);background:#F5F9FF}
.sidebar a.active{color:var(--primary);border-left-color:var(--primary);background:#F0F6FF;font-weight:600}
.sidebar a.new-ch{color:var(--accent);font-weight:600}
.sidebar a.new-ch::after{content:"NEW";font-size:0.65em;background:var(--accent);color:#fff;padding:1px 5px;border-radius:6px;margin-left:6px}
.sidebar .toc-title{padding:12px 20px 8px;font-size:0.75em;color:#9AB;font-weight:700;text-transform:uppercase;letter-spacing:1px}
/* 主内容 */
.content{margin-top:56px;margin-left:260px;padding:40px 48px;max-width:none}
.content-inner{max-width:760px;margin:0 auto}
.content-inner h1{font-size:1.8em;color:var(--primary-dark);margin-bottom:8px;padding-bottom:12px;border-bottom:2px solid var(--border)}
.content-inner h2{font-size:1.35em;color:var(--primary-dark);margin-top:40px;margin-bottom:16px;padding:8px 16px;background:#F0F6FF;border-radius:8px;border-left:4px solid var(--primary)}
.content-inner h2:first-child{margin-top:0}
.content-inner h3{font-size:1.1em;color:var(--text);margin-top:24px;margin-bottom:12px}
.content-inner h4{font-size:0.98em;color:var(--primary-dark);margin-top:16px;margin-bottom:8px}
.content-inner p{margin-bottom:12px;color:var(--text);line-height:1.9}
.content-inner ul,.content-inner ol{margin-bottom:16px;padding-left:28px}
.content-inner li{margin-bottom:6px;line-height:1.8}
.content-inner blockquote{margin:16px 0;padding:12px 20px;background:#FFF8E8;border-left:4px solid #FFD060;border-radius:0 8px 8px 0;color:#8A6D00}
.content-inner blockquote p{margin:0}
.content-inner table{width:100%;border-collapse:collapse;margin:16px 0;font-size:0.88em}
.content-inner th{background:var(--primary);color:#fff;padding:10px 14px;text-align:left;font-weight:600}
.content-inner td{padding:8px 14px;border:1px solid var(--border)}
.content-inner tr:nth-child(even){background:#F8FBFF}
.content-inner img{max-width:100%;border-radius:8px;margin:12px 0}
.content-inner a{color:var(--primary);text-decoration:none}
.content-inner a:hover{text-decoration:underline}
.content-inner code{background:#F0F4F8;padding:2px 6px;border-radius:4px;font-size:0.9em;color:var(--accent);font-family:"Courier New",monospace}
.content-inner strong{color:var(--text)}
.content-inner hr{border:none;border-top:2px dashed var(--border);margin:32px 0}
.content-inner em{color:var(--text-secondary)}
/* 移动端折叠 */
.menu-toggle{display:none;position:fixed;bottom:20px;right:20px;width:48px;height:48px;background:var(--primary);color:#fff;border:none;border-radius:50%;font-size:1.3em;cursor:pointer;box-shadow:0 4px 16px rgba(71,151,255,0.35);z-index:101}
/* 移动端 */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform 0.3s;z-index:99;width:280px}
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 20px rgba(0,0,0,0.1)}
  .content{margin-left:0;padding:20px 16px}
  .content-inner{max-width:100%}
  .menu-toggle{display:flex;align-items:center;justify-content:center}
  .topbar .title{font-size:0.85em}
}
/* 加载 */
.loading{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.loading .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">← 返回首页</a>
  <span class="title">📖 内江职院新生指南 · 全文阅读</span>
</div>

<aside class="sidebar" id="sidebar">
  <div class="toc-title">目录导航</div>
</aside>
<button class="menu-toggle" id="menuBtn">☰</button>

<div class="content">
  <div class="content-inner" id="article">
    <div class="loading">
      <div class="spinner"></div>
      <p>正在加载知识库…</p>
    </div>
  </div>
</div>

<script>
// 中文标题转安全锚点ID
function slugify(text) {
  var s = text.replace(/^#+\s*/, '').trim();
  // 直接用中文做锚点更稳定，GitHub style 也支持中文
  s = s.replace(/[^\w\u4e00-\u9fff]+/g, '-');
  return s;
}

// 目录数据
var chapters = [
  {num:'一', title:'你好，新同学', isNew:false},
  {num:'二', title:'录取通知书查询', isNew:true},
  {num:'三', title:'校园地图', isNew:false},
  {num:'四', title:'报到全流程', isNew:false},
  {num:'五', title:'开学预备物品清单', isNew:true},
  {num:'六', title:'宿舍生活', isNew:false},
  {num:'七', title:'吃喝在校', isNew:false},
  {num:'八', title:'生活设施与营业时间', isNew:false},
  {num:'九', title:'运动与休闲', isNew:false},
  {num:'十', title:'军训攻略', isNew:false},
  {num:'十一', title:'学习指南', isNew:false},
  {num:'十二', title:'出行交通', isNew:false},
  {num:'十三', title:'医疗与安全', isNew:false},
  {num:'十四', title:'财务管理', isNew:false},
  {num:'十五', title:'生源地助学贷款指南', isNew:true},
  {num:'十六', title:'助学金与校内资助', isNew:true},
  {num:'十七', title:'社团与组织', isNew:false},
  {num:'十八', title:'必知校规', isNew:false},
  {num:'十九', title:'防骗指南与校园安全防范', isNew:true},
  {num:'二十', title:'周边生活圈', isNew:false},
  {num:'二十一', title:'家长送校指南', isNew:false},
  {num:'二十二', title:'专业大揭秘', isNew:true},
  {num:'二十三', title:'电脑选购指南', isNew:true},
  {num:'二十四', title:'手机必备APP与官方公众号', isNew:true},
  {num:'二十五', title:'学期日历', isNew:false},
  {num:'附录', title:'附录', isNew:false}
];

// 构建侧边目录
var sidebarEl = document.getElementById('sidebar');
chapters.forEach(function(ch) {
  var a = document.createElement('a');
  a.href = '#' + ch.num + '-' + ch.title;
  a.textContent = ch.num + '、' + ch.title;
  a.dataset.anchor = ch.num + '-' + ch.title;
  if (ch.isNew) a.className = 'new-ch';
  a.addEventListener('click', function(e) {
    e.preventDefault();
    var target = document.getElementById(a.dataset.anchor);
    if (target) {
      var topOffset = target.offsetTop - 70;
      window.scrollTo({top: topOffset, behavior: 'smooth'});
    }
    // 移动端关闭侧栏
    sidebarEl.classList.remove('open');
  });
  sidebarEl.appendChild(a);
});

// 加载 Markdown 并渲染
fetch('references/knowledge_base.md')
  .then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then(function(md) {
    // 去掉 YAML front matter
    md = md.replace(/^---[\s\S]*?---\n*/, '');
    // marked 渲染
    var html = marked.parse(md);
    document.getElementById('article').innerHTML = html;

    // 给所有 h2 添加 id（用于锚点跳转）
    var headings = document.querySelectorAll('#article h2');
    headings.forEach(function(h) {
      var text = h.textContent.replace(/^#+\s*/, '').trim();
      // 匹配 "一、你好新同学" 格式
      var match = text.match(/^(.+?)、(.+)/);
      if (match) {
        h.id = match[1] + '-' + match[2].trim();
      } else {
        h.id = slugify(text);
      }
    });

    // 滚动监听 - 高亮当前章节
    var tocLinks = sidebarEl.querySelectorAll('a');
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var id = entry.target.id;
          tocLinks.forEach(function(link) {
            if (link.dataset.anchor === id) {
              link.classList.add('active');
            } else {
              link.classList.remove('active');
            }
          });
        }
      });
    }, {rootMargin: '-80px 0px -70% 0px'});

    headings.forEach(function(h) { observer.observe(h); });

    // 检查 URL hash，跳转到对应章节
    if (location.hash) {
      var hash = decodeURIComponent(location.hash.substring(1));
      setTimeout(function() {
        var el = document.getElementById(hash);
        if (el) {
          window.scrollTo({top: el.offsetTop - 70, behavior: 'smooth'});
        }
      }, 300);
    }
  })
  .catch(function(err) {
    document.getElementById('article').innerHTML =
      '<p style="color:#e44;text-align:center;padding:40px;">加载失败：' + err.message + '<br>请稍后重试，或直接访问 <a href="https://github.com/LLYJ002/njvtc-freshman-guide/blob/main/references/knowledge_base.md">GitHub 仓库</a> 阅读。</p>';
  });

// 移动端菜单切换
document.getElementById('menuBtn').addEventListener('click', function() {
  sidebarEl.classList.toggle('open');
});

// 点击页面其他区域关闭移动端侧栏
document.addEventListener('click', function(e) {
  if (window.innerWidth <= 900) {
    if (!sidebarEl.contains(e.target) && e.target.id !== 'menuBtn') {
      sidebarEl.classList.remove('open');
    }
  }
});
</script>
</body>
</html>
