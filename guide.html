<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内江职业技术学院新生指南 - 智慧问答</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root{--primary:#4797FF;--primary-dark:#2E80E0;--primary-light:#E8F4FF;--bg:#F0F5FA;--card:#FFFFFF;--text:#1A2238;--text-secondary:#6B7A90;--border:#E2EAF4;--accent:#FF7E47;--accent-light:#FFF0E8;--green:#52C41A;--shadow-sm:0 1px 3px rgba(71,151,255,0.06);--shadow:0 2px 12px rgba(71,151,255,0.08);--shadow-lg:0 8px 32px rgba(71,151,255,0.12);--radius:14px;--radius-sm:8px}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.75;-webkit-font-smoothing:antialiased}

/* Topbar */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;z-index:100}
.topbar .back{color:var(--primary);text-decoration:none;font-size:0.88em;font-weight:600;display:flex;align-items:center;gap:4px;transition:opacity 0.2s}
.topbar .back:hover{opacity:0.7}
.topbar .tabs{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:2px;background:var(--bg);border-radius:24px;padding:3px}
.topbar .tab{padding:6px 20px;border-radius:20px;font-size:0.86em;font-weight:600;color:var(--text-secondary);cursor:pointer;transition:all 0.25s;border:none;background:none}
.topbar .tab.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(71,151,255,0.3)}
.topbar .tab:hover:not(.active){color:var(--primary)}

/* Sidebar */
.sidebar{position:fixed;top:56px;left:0;bottom:0;width:240px;background:var(--card);border-right:1px solid var(--border);overflow-y:auto;padding:12px 0;display:none}
.sidebar.show{display:block}
.sidebar a{display:block;padding:7px 20px;color:var(--text-secondary);text-decoration:none;font-size:0.82em;transition:all 0.15s;border-left:3px solid transparent;font-weight:500}
.sidebar a:hover{color:var(--primary);background:var(--primary-light)}
.sidebar a.active{color:var(--primary);border-left-color:var(--primary);background:var(--primary-light);font-weight:700}
.sidebar a.new-ch{color:var(--accent)}
.sidebar a.new-ch::after{content:'NEW';font-size:0.7em;background:var(--accent);color:#fff;padding:1px 5px;border-radius:5px;margin-left:6px;font-weight:700}
.sidebar .toc-title{padding:12px 20px 6px;font-size:0.7em;color:#9AB;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}

/* Content area */
.content{margin-top:56px;padding:28px 24px 80px;max-width:880px;margin-left:auto;margin-right:auto}
.content-inner{max-width:720px;margin:0 auto}
.content-inner h1{font-size:1.7em;color:var(--primary-dark);margin-bottom:8px;padding-bottom:12px;border-bottom:2px solid var(--border)}
.content-inner h2{font-size:1.3em;color:var(--primary-dark);margin-top:40px;margin-bottom:16px;padding:10px 18px;background:linear-gradient(135deg,var(--primary-light),#F5FAFF);border-radius:10px;border-left:4px solid var(--primary);scroll-margin-top:70px;font-weight:700}
.content-inner h3{font-size:1.06em;color:var(--text);margin-top:24px;margin-bottom:10px;font-weight:700}
.content-inner p{margin-bottom:10px;line-height:1.85}
.content-inner ul,.content-inner ol{margin-bottom:14px;padding-left:26px}
.content-inner li{margin-bottom:5px;line-height:1.75}
.content-inner blockquote{margin:14px 0;padding:12px 18px;background:linear-gradient(135deg,#FFF8E8,#FFFCF2);border-left:4px solid #FFD060;border-radius:0 10px 10px 0;color:#8A6D00}
.content-inner blockquote p{margin:0}
.content-inner table{width:100%;border-collapse:collapse;margin:16px 0;font-size:0.86em;border-radius:var(--radius-sm);overflow:hidden;box-shadow:var(--shadow-sm)}
.content-inner th{background:var(--primary);color:#fff;padding:10px 14px;text-align:left;font-weight:600}
.content-inner td{padding:8px 14px;border:1px solid var(--border)}
.content-inner tr:nth-child(even){background:#F8FBFF}
.content-inner img{max-width:100%;border-radius:10px;margin:12px 0}
.content-inner a{color:var(--primary);text-decoration:none;font-weight:600}
.content-inner a:hover{text-decoration:underline}
.content-inner strong{color:var(--text)}
.content-inner hr{border:none;border-top:2px dashed var(--border);margin:32px 0}
.content-inner code{background:#F0F4F8;padding:2px 6px;border-radius:4px;font-size:0.88em;color:var(--accent);font-family:"Courier New",monospace}

/* Menu toggle */
.menu-toggle{display:none;position:fixed;bottom:20px;right:20px;width:48px;height:48px;background:var(--primary);color:#fff;border:none;border-radius:50%;font-size:1.3em;cursor:pointer;box-shadow:0 4px 20px rgba(71,151,255,0.4);z-index:101;align-items:center;justify-content:center;transition:transform 0.2s}
.menu-toggle:hover{transform:scale(1.08)}

/* Loading */
.loading{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.loading .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== QA View ===== */
.qa-view{display:none}
.qa-view.active{display:block}
.read-view{display:none}
.read-view.active{display:block}

/* QA Hero */
.qa-hero{text-align:center;padding:36px 20px 24px}
.qa-hero .ai-icon{width:64px;height:64px;margin:0 auto 14px;background:linear-gradient(135deg,var(--primary),#6AB4FF);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:1.8em;box-shadow:0 8px 24px rgba(71,151,255,0.25)}
.qa-hero h2{font-size:1.5em;color:var(--text);margin-bottom:6px;font-weight:800}
.qa-hero p{color:var(--text-secondary);font-size:0.92em}

/* Search box */
.qa-search-box{max-width:620px;margin:22px auto 16px;position:relative}
.qa-search-box input{width:100%;padding:15px 56px 15px 22px;border:2px solid var(--border);border-radius:30px;font-size:0.96em;outline:none;transition:all 0.25s;font-family:inherit;background:var(--card);box-shadow:var(--shadow)}
.qa-search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-light)}
.qa-search-box button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:none;border-radius:50%;background:var(--primary);color:#fff;cursor:pointer;font-size:1.1em;transition:all 0.2s;box-shadow:0 2px 8px rgba(71,151,255,0.3)}
.qa-search-box button:hover{background:var(--primary-dark);transform:translateY(-50%) scale(1.05)}

/* Hot tags */
.qa-hot{max-width:620px;margin:0 auto 28px}
.qa-hot .hot-title{font-size:0.78em;color:#9AB;margin-bottom:10px;font-weight:700;letter-spacing:1px}
.qa-hot .hot-tags{display:flex;flex-wrap:wrap;gap:8px}
.qa-hot .hot-tag{padding:7px 16px;background:var(--card);border:1px solid var(--border);border-radius:20px;font-size:0.84em;color:var(--primary);cursor:pointer;transition:all 0.2s;font-weight:500}
.qa-hot .hot-tag:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:translateY(-2px);box-shadow:0 2px 8px rgba(71,151,255,0.2)}

/* Chat history */
.qa-history{max-width:680px;margin:0 auto}
.qa-msg{margin-bottom:18px;animation:fadeIn 0.35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.qa-msg.user{text-align:right}
.qa-msg.user .bubble{display:inline-block;background:var(--primary);color:#fff;padding:10px 18px;border-radius:20px 20px 4px 20px;max-width:75%;text-align:left;font-size:0.9em;box-shadow:0 2px 8px rgba(71,151,255,0.2)}
.qa-msg.bot .bubble{display:inline-block;background:var(--card);border:1px solid var(--border);padding:16px 20px;border-radius:4px 20px 20px 20px;max-width:88%;text-align:left;font-size:0.9em;box-shadow:var(--shadow);line-height:1.85}
.qa-msg.bot .bubble h2{font-size:1.02em;background:none;border:none;padding:0;border-left:none;margin-top:10px}
.qa-msg.bot .bubble h3{font-size:0.96em}
.qa-msg.bot .bubble table{font-size:0.86em}
.qa-msg.bot .bubble ul,.qa-msg.bot .bubble ol{padding-left:22px}
.qa-msg.bot .bubble strong{color:var(--primary-dark)}
.qa-msg.bot .bubble .ch-ref{display:inline-block;font-size:0.76em;color:var(--primary);background:var(--primary-light);padding:3px 12px;border-radius:12px;margin-top:8px;cursor:pointer;transition:all 0.2s;font-weight:600}
.qa-msg.bot .bubble .ch-ref:hover{background:var(--primary);color:#fff}
.qa-msg.bot .bubble .disclaimer{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);font-size:0.78em;color:#9AB}

/* Empty state */
.qa-empty{text-align:center;padding:48px 20px;color:var(--text-secondary)}
.qa-empty .icon{font-size:2.8em;margin-bottom:14px;opacity:0.25}
.qa-empty p{margin-bottom:4px}

/* Suggestions */
.qa-suggest{max-width:680px;margin:18px auto 0}
.qa-suggest .s-title{font-size:0.76em;color:#9AB;margin-bottom:8px;font-weight:700;letter-spacing:1px}
.qa-suggest .s-items{display:flex;flex-wrap:wrap;gap:8px}
.qa-suggest .s-item{padding:6px 14px;background:var(--card);border:1px solid var(--border);border-radius:16px;font-size:0.8em;color:var(--primary);cursor:pointer;transition:all 0.2s;font-weight:500}
.qa-suggest .s-item:hover{background:var(--primary-light);border-color:var(--primary)}

/* Bot avatar */
.qa-msg.bot{display:flex;gap:10px;align-items:flex-start}
.qa-msg.bot .avatar{width:32px;height:32px;flex-shrink:0;background:linear-gradient(135deg,var(--primary),#6AB4FF);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:0.9em;color:#fff;margin-top:2px;box-shadow:0 2px 8px rgba(71,151,255,0.2)}
.qa-msg.bot .bubble-wrap{flex:1;min-width:0}
.qa-msg.user .avatar{display:none}

/* Responsive */
@media(max-width:900px){
  .menu-toggle{display:flex}
  .sidebar{transform:translateX(-100%);transition:transform 0.3s;z-index:99;width:280px;box-shadow:4px 0 20px rgba(0,0,0,0.08)}
  .sidebar.show{transform:translateX(0)}
  .content{padding:20px 14px 80px}
  .content-inner{max-width:100%}
  .topbar .tab{padding:5px 14px;font-size:0.78em}
  .qa-msg.bot .bubble{max-width:95%}
  .qa-msg.user .bubble{max-width:85%}
  .topbar .back{font-size:0.78em}
}
</style>
</head>

<div class="topbar">
  <a class="back" href="index.html">← 返回首页</a>
  <div class="tabs">
    <button class="tab active" id="tabQA" onclick="switchTab('qa')">💬 智慧问答</button>

  </div>
</div>

    </div>
    <div class="qa-hot">
      <div class="hot-title">🔥 热门问题</div>

    </div>
    <div class="qa-history" id="qaHistory">
      <div class="qa-empty">
        <div class="icon">💬</div>
        <p>欢迎来到内江职业技术学院新生智慧问答！</p>
        <p style="margin-top:4px;font-size:0.84em">点击上方热门问题或在搜索框输入你的问题</p>
      </div>
    </div>
    <div class="qa-suggest" id="qaSuggest" style="display:none">
      <div class="s-title">你可能还想问：</div>
      <div class="s-items" id="sItems"></div>
    </div>
  </div>
</div>

<!-- 全文阅读视图 -->
<div class="read-view" id="readView">
  <div class="content">
    <div class="content-inner" id="article">
      <div class="loading">
        <div class="spinner"></div>
        <p>正在加载知识库…</p>
      </div>
    </div>
  </div>
</div>

// ========== Tab 切换 ==========
function switchTab(tab) {
  if (tab === 'qa') {
    document.getElementById('qaView').classList.add('active');
    document.getElementById('readView').classList.remove('active');
    document.getElementById('tabQA').classList.add('active');
    document.getElementById('tabRead').classList.remove('active');
    document.getElementById('sidebar').classList.remove('show');
    document.getElementById('menuBtn').style.display = 'none';
    document.getElementById('qaInput').focus();
  } else {
    document.getElementById('qaView').classList.remove('active');
    document.getElementById('readView').classList.add('active');
    document.getElementById('tabQA').classList.remove('active');
    document.getElementById('tabRead').classList.add('active');
    document.getElementById('sidebar').classList.add('show');
    document.getElementById('menuBtn').style.display = 'flex';
    if (!document.getElementById('article').dataset.rendered) {
      renderArticle();
    }
  }
}

// ========== 渲染全文 ==========
function renderArticle() {
  if (!KB_RAW) {
    document.getElementById('article').innerHTML = '<p style="color:#e44;text-align:center;padding:40px;">知识库加载失败，请刷新页面重试。</p>';
    return;
  }
  var html = marked.parse(KB_RAW);
  document.getElementById('article').innerHTML = html;
  document.getElementById('article').dataset.rendered = '1';

  var headings = document.querySelectorAll('#article h2');
  headings.forEach(function(h) {
    var text = h.textContent.replace(/^#+\s*/, '').trim();
    var match = text.match(/^(.+?)、(.+)/);
    if (match) {
      h.id = match[1] + '-' + match[2].trim();
      h.dataset.chapter = match[1];
    }
  });

  var sidebar = document.getElementById('sidebar');
  var tocTitle = sidebar.querySelector('.toc-title');
  while (tocTitle.nextSibling) {
    sidebar.removeChild(tocTitle.nextSibling);
  }
  headings.forEach(function(h) {
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    a.dataset.anchor = h.id;
    var ch = chapters.find(function(c) { return c.num === h.dataset.chapter; });
    if (ch && ch.isNew) a.className = 'new-ch';
    a.addEventListener('click', function(e) {
      e.preventDefault();
      var topOffset = h.offsetTop - 70;
      window.scrollTo({top: topOffset, behavior: 'smooth'});
      sidebar.classList.remove('show');
    });
    sidebar.appendChild(a);
  });

  var tocLinks = sidebar.querySelectorAll('a');
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        var id = entry.target.id;
        tocLinks.forEach(function(link) {
          link.classList.toggle('active', link.dataset.anchor === id);
        });
      }
    });
  }, {rootMargin: '-80px 0px -70% 0px'});
  headings.forEach(function(h) { observer.observe(h); });
}

// ========== 智慧问答 ==========
function splitChapters(md) {
  var parts = md.split(/^## /m);
  var result = [];
  for (var i = 1; i < parts.length; i++) {
    var part = parts[i];
    var lines = part.split('\n');
    var titleLine = lines[0].trim();
    var match = titleLine.match(/^(.+?)、(.+)/);
    var num = match ? match[1] : titleLine;
    var title = match ? match[2].trim() : titleLine;
    var content = '## ' + part;
    result.push({num: num, title: title, content: content});
  }
  return result;
}

var allChapters = null;
function getChapters() {
  if (!allChapters) allChapters = splitChapters(KB_RAW);
  return allChapters;
}

function searchAnswer(query) {
  var chs = getChapters();
  var scores = [];
  var queryLower = query.toLowerCase();

  chs.forEach(function(ch) {
    var meta = chapters.find(function(c) { return c.num === ch.num; });
    var score = 0;

    if (meta) {
      meta.keywords.forEach(function(kw) {
        if (queryLower.indexOf(kw.toLowerCase()) >= 0) score += 10;
        if (queryLower.indexOf(kw.toLowerCase()) >= 0 && queryLower.trim() === kw.toLowerCase()) score += 20;
      });
      if (queryLower.indexOf(meta.title.toLowerCase()) >= 0) score += 15;
      if (queryLower.indexOf(ch.num) >= 0) score += 10;
    }

    var queryChars = query.replace(/[？?，,。.！!、的了吗呢吧啊我你他她有是在什么怎么如何多少]/g, '').trim();
    if (queryChars.length > 1) {
      queryChars.split('').forEach(function(c) {
        if (c.length > 0 && ch.content.indexOf(c) >= 0) score += 0.3;
      });
    }

    var keyPhrases = query.match(/[\u4e00-\u9fff]{2,6}/g);
    if (keyPhrases) {
      keyPhrases.forEach(function(phrase) {
        if (ch.content.indexOf(phrase) >= 0) score += 5;
      });
    }

    if (score > 0) scores.push({chapter: ch, score: score, meta: meta});
  });

  scores.sort(function(a, b) { return b.score - a.score; });
  return scores;
}

function extractRelevantSection(chapter, query) {
  var lines = chapter.content.split('\n');
  if (lines.length <= 20) return chapter.content;

  var bestStart = 0, bestScore = 0, windowSize = 15;
  for (var i = 0; i <= lines.length - windowSize; i++) {
    var block = lines.slice(i, i + windowSize).join('\n');
    var score = 0;
    var keyPhrases = query.match(/[\u4e00-\u9fff]{2,6}/g);
    if (keyPhrases) keyPhrases.forEach(function(phrase) { if (block.indexOf(phrase) >= 0) score += 3; });
    if (score > bestScore) { bestScore = score; bestStart = i; }
  }

  if (bestScore > 0) {
    var start = Math.max(0, bestStart - 2);
    var end = Math.min(lines.length, bestStart + windowSize + 3);
    var result = lines[0] + '\n';
    for (var j = start; j < end; j++) { if (j > 0) result += lines[j] + '\n'; }
    return result;
  }
  return chapter.content;
}

function qaAsk(question) {
  if (!question) question = document.getElementById('qaInput').value.trim();
  if (!question) return;
  document.getElementById('qaInput').value = '';

  var history = document.getElementById('qaHistory');
  var empty = history.querySelector('.qa-empty');
  if (empty) empty.remove();

  // 用户消息
  var userMsg = document.createElement('div');
  userMsg.className = 'qa-msg user';
  userMsg.innerHTML = '<div class="bubble">' + escapeHtml(question) + '</div>';
  history.appendChild(userMsg);

  var results = searchAnswer(question);

  // 机器人消息
  var botMsg = document.createElement('div');
  botMsg.className = 'qa-msg bot';
  var avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '🎓';
  var bubbleWrap = document.createElement('div');
  bubbleWrap.className = 'bubble-wrap';
  var bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (results.length === 0) {
    bubble.innerHTML = '<p>抱歉，知识库中暂未找到与你的问题直接相关的内容。</p><p>建议尝试以下方式：</p><ul><li>更换关键词搜索（如"学费"、"宿舍"、"军训"）</li><li>切换到"📖 全文阅读"浏览完整25章内容</li><li>咨询学校招生办：0832-2265927</li></ul><div class="disclaimer">💡 具体政策、收费标准及时间安排请以学校官方及各部门最新通知为准。</div>';
  } else {
    var topResult = results[0];
    var chapter = topResult.chapter;
    var meta = topResult.meta;
    var relevantContent = extractRelevantSection(chapter, question);
    var answerHtml = marked.parse(relevantContent);

    var extraChapters = '';
    if (results.length > 1 && results[1].score > 5) {
      var related = results.slice(1, 3).map(function(r) {
        return '<span class="ch-ref" onclick="jumpToChapter(\'' + r.chapter.num + '\')">📌 ' + r.chapter.num + '、' + r.chapter.title + '</span>';
      }).join(' ');
      extraChapters = '<div style="margin-top:10px">相关章节：' + related + '</div>';
    }

    bubble.innerHTML = answerHtml + extraChapters + '<div class="ch-ref" onclick="switchTab(\'read\');setTimeout(function(){jumpToChapter(\'' + chapter.num + '\')},200)">📖 查看完整章节：' + chapter.num + '、' + chapter.title + '</div><div class="disclaimer">💡 具体政策、收费标准及时间安排请以内江职业技术学院官方及各部门最新通知为准。</div>';
  }

  bubbleWrap.appendChild(bubble);
  botMsg.appendChild(avatar);
  botMsg.appendChild(bubbleWrap);
  history.appendChild(botMsg);

  history.scrollIntoView({behavior: 'smooth', block: 'end'});
  showSuggestions(question, results);
}

function showSuggestions(question, results) {
  var suggestEl = document.getElementById('qaSuggest');
  var sItems = document.getElementById('sItems');
  sItems.innerHTML = '';
  var suggestions = [];

  if (results.length > 1) {
    for (var i = 1; i < Math.min(results.length, 4); i++) {
      if (results[i].score > 3 && results[i].meta) {
        suggestions.push(results[i].meta.title + '是什么？');
      }
    }
  }

  var general = ['报到流程是什么？', '宿舍怎么分配？', '怎么坐车到学校？', '奖学金怎么申请？'];
  general.forEach(function(g) {
    if (suggestions.indexOf(g) < 0 && suggestions.length < 4) suggestions.push(g);
  });

  if (suggestions.length > 0) {
    suggestions.slice(0, 4).forEach(function(s) {
      var item = document.createElement('span');
      item.className = 's-item';
      item.textContent = s;
      item.onclick = function() { qaAsk(s); };
      sItems.appendChild(item);
    });
    suggestEl.style.display = 'block';
  } else {
    suggestEl.style.display = 'none';
  }
}

function jumpToChapter(chNum) {
  switchTab('read');
  setTimeout(function() {
    var headings = document.querySelectorAll('#article h2');
    for (var i = 0; i < headings.length; i++) {
      if (headings[i].dataset.chapter === chNum) {
        window.scrollTo({top: headings[i].offsetTop - 70, behavior: 'smooth'});
        break;
      }
    }
  }, 100);
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

hotQuestions.forEach(function(q) {

  tag.className = 'hot-tag';
  tag.textContent = q;
  tag.onclick = function() { qaAsk(q); };
  hotTagsEl.appendChild(tag);
});
